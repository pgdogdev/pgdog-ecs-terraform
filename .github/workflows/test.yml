name: Test Terraform module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Pull PgDog enterprise image
        run: docker pull ghcr.io/pgdogdev/pgdog-enterprise:main-ent

      - name: Add pgdog container wrapper to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/pgdog" <<'EOF'
          #!/bin/bash
          exec docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --workdir "$PWD" \
            --entrypoint pgdog \
            ghcr.io/pgdogdev/pgdog-enterprise:main-ent "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/pgdog"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Validate module
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run tests
        run: ./tests/test.sh
